# Supply-chain gates pnpm would otherwise apply. The package targets the DSH
# 0.1.7 line, whose prerelease packages are recent by definition, so each exact
# version in play is named here rather than disabling the age gate itself.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.3 || 4.0.4'
  - '@deepseek-ai/cordis-plugin-loader@1.0.4 || 1.0.5'
  - '@deepseek-ai/cosmokit@1.8.4 || 1.8.5'
  - '@deepseek-ai/dsh-agent@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-credentials@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-invariants@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-launch-environment@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-llm@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-scope@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-session@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-session-projection@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-timeout@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-util-crypto@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-util-values@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-web@0.1.7-alpha.1'
  - '@deepseek-ai/schemastery@3.18.3 || 3.18.4'
